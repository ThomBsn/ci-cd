<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0a0a0a;
            color: #fafafa;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #262626;
            background-color: #0a0a0a;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 svg {
            width: 1.5rem;
            height: 1.5rem;
            color: #3b82f6;
        }

        .api-config label {
            font-size: 0.875rem;
            color: #a1a1aa;
        }

        .api-config input {
            padding: 0.5rem 0.75rem;
            border: 1px solid #262626;
            border-radius: 0.5rem;
            background-color: #171717;
            color: #fafafa;
            font-size: 0.875rem;
            width: 200px;
        }

        .api-config input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 1rem;
            color: #71717a;
        }

        .welcome svg {
            width: 3rem;
            height: 3rem;
            color: #3b82f6;
        }

        .welcome p {
            font-size: 1rem;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 0.75rem;
            max-width: 80%;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .message.user .avatar {
            background-color: #3b82f6;
            color: white;
        }

        .message.assistant .avatar {
            background-color: #262626;
            color: #a1a1aa;
        }

        .message-content {
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background-color: #3b82f6;
            color: white;
            border-bottom-right-radius: 0.25rem;
        }

        .message.assistant .message-content {
            background-color: #171717;
            border: 1px solid #262626;
            border-bottom-left-radius: 0.25rem;
        }

        /* Loading */
        .loading-dots {
            display: flex;
            gap: 0.25rem;
            padding: 0.5rem 0;
        }

        .loading-dots span {
            width: 0.5rem;
            height: 0.5rem;
            background-color: #71717a;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: -0.16s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* Error */
        .error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            margin: 0 1.5rem;
        }

        /* Input Form */
        .input-container {
            padding: 1rem 1.5rem;
            border-top: 1px solid #262626;
            background-color: #0a0a0a;
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .input-form input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #262626;
            border-radius: 0.75rem;
            background-color: #171717;
            color: #fafafa;
            font-size: 1rem;
        }

        .input-form input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .input-form input::placeholder {
            color: #71717a;
        }

        .input-form button {
            padding: 0.75rem 1.5rem;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: background-color 0.2s;
        }

        .input-form button:hover:not(:disabled) {
            background-color: #2563eb;
        }

        .input-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-form button svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        /* Scrollbar */
        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background-color: #262626;
            border-radius: 3px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background-color: #3f3f46;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .api-config input {
                flex: 1;
                width: auto;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <h1>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8"/>
            <rect width="16" height="12" x="4" y="8" rx="2"/>
            <path d="M2 14h2"/>
            <path d="M20 14h2"/>
            <path d="M15 13v2"/>
            <path d="M9 13v2"/>
        </svg>
        Gemini Chat
    </h1>
</header>

<main class="messages-container" id="messages">
    <div class="welcome">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 8V4H8"/>
            <rect width="16" height="12" x="4" y="8" rx="2"/>
            <path d="M2 14h2"/>
            <path d="M20 14h2"/>
            <path d="M15 13v2"/>
            <path d="M9 13v2"/>
        </svg>
        <p>Commencez une conversation avec Gemini</p>
    </div>
</main>

<div id="error-container"></div>

<footer class="input-container">
    <form class="input-form" id="chat-form">
        <input
                type="text"
                id="message-input"
                placeholder="Tapez votre message..."
                autocomplete="off"
                required
        >
        <button type="submit" id="send-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m22 2-7 20-4-9-9-4Z"/>
                <path d="M22 2 11 13"/>
            </svg>
            Envoyer
        </button>
    </form>
</footer>

<script>
    const messagesContainer = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const errorContainer = document.getElementById('error-container');
    const sendBtn = document.getElementById('send-btn');

    let messages = [];
    let isLoading = false;

    function renderMessages() {
        if (messages.length === 0) {
            messagesContainer.innerHTML = `
          <div class="welcome">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 8V4H8"/>
              <rect width="16" height="12" x="4" y="8" rx="2"/>
              <path d="M2 14h2"/>
              <path d="M20 14h2"/>
              <path d="M15 13v2"/>
              <path d="M9 13v2"/>
            </svg>
            <p>Commencez une conversation avec Gemini</p>
          </div>
        `;
            return;
        }

        let html = '';
        messages.forEach(msg => {
            const isUser = msg.role === 'user';
            html += `
          <div class="message ${msg.role}">
            <div class="avatar">${isUser ? 'Vous' : 'IA'}</div>
            <div class="message-content">${escapeHtml(msg.content).replace(/\n/g, '<br>').replace('**', '')}</div>
          </div>
        `;
        });

        if (isLoading) {
            html += `
          <div class="message assistant">
            <div class="avatar">IA</div>
            <div class="message-content">
              <div class="loading-dots">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        `;
        }

        messagesContainer.innerHTML = html;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function showError(message) {
        errorContainer.innerHTML = `<div class="error">${escapeHtml(message)}</div>`;
        setTimeout(() => {
            errorContainer.innerHTML = '';
        }, 5000);
    }

    function setLoading(loading) {
        isLoading = loading;
        sendBtn.disabled = loading;
        messageInput.disabled = loading;
        renderMessages();
    }

    async function sendMessage(content) {
        messages.push({role: 'user', content});
        setLoading(true);
        errorContainer.innerHTML = '';

        try {
            const response = await fetch("/gemini", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({prompt: content}),
            });

            if (!response.ok) {
                throw new Error(`Erreur HTTP: ${response.status}`);
            }

            const data = await response.json();
            const aiResponse = data.result || "Pas de réponse";

            messages.push({role: 'assistant', content: aiResponse});
        } catch (error) {
            showError(`Impossible de contacter l'API: ${error.message}`);
            messages.pop();
        } finally {
            setLoading(false);
        }
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const content = messageInput.value.trim();
        if (!content || isLoading) return;

        messageInput.value = '';
        await sendMessage(content);
        messageInput.focus();
    });

    // Initial render
    renderMessages();
</script>
</body>
</html>
